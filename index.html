<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Filmes</title>

    <style>
        .selecionado {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>

    <h1>Lista de Filmes</h1>

    <input type="text" id="filme" placeholder="Digite o nome do filme">
    <button id="adicionar">Adicionar filme</button>

    <br><br>

    <button id="az">Ordenar A-Z</button>
    <button id="za">Ordenar Z-A</button>

    <br><br>

    <input type="text" id="busca" placeholder="Buscar filme">

    <ol id="listaFilmes"></ol>

    <script src="script.js"></script>
</body>
</html>
